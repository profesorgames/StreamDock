name: Windows portable EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a versioned GitHub Release after successful Windows checks'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: .payload-cache
          key: windows-tools-${{ hashFiles('scripts/dependencies.lock.json') }}
      - name: Build hash-verified single EXE and test core
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Test the actual portable executable on Windows
        shell: pwsh
        run: ./scripts/test-windows.ps1
      - name: Upload EXE and checksum
        uses: actions/upload-artifact@v4
        with:
          name: StreamDock-Windows-x64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload verification reports and interface screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-verification
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

  release:
    needs: build-and-check
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: StreamDock-Windows-x64
          path: dist
      - name: Publish verified portable EXE
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$REF_NAME" == v* ]]; then
            release_tag="$REF_NAME"
          else
            release_tag="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$release_tag" --repo "$REPO" --target "$COMMIT" \
            --title "StreamDock $release_tag · Windows portable" \
            --notes-file RELEASE_NOTES.md dist/StreamDock.exe dist/SHA256SUMS.txt
